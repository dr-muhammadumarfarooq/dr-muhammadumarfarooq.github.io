name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier Check
        id: prettier
        shell: bash
        run: |
          set +e
          npm run --silent format:list | tee prettier-files.txt
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "::error::Files listed above need formatting. Run: npm run format"
          fi

          exit "$status"

      - name: Create diff
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        run: |
          npm run --silent format
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt

      - name: Upload Prettier diagnostics
        id: artifact-upload
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Prettier diagnostics
          path: |
            prettier-files.txt
            diff.txt
            diff.html
          retention-days: 7

      - name: Dispatch information to repository
        if: ${{ failure() && steps.prettier.conclusion == 'failure' && github.event_name == 'pull_request' }}
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: prettier-failed-on-pr
          client-payload: '{"pr_number": "${{ github.event.number }}", "artifact_url": "${{ steps.artifact-upload.outputs.artifact-url }}", "run_id": "${{ github.run_id }}"}'
