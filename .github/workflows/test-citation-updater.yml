name: Test citation updater

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "bin/update_scholar_citations.py"
      - "tests/test_citation_updater.py"
      - ".github/workflows/update-citations.yml"
      - ".github/workflows/test-citation-updater.yml"
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "bin/update_scholar_citations.py"
      - "tests/test_citation_updater.py"
      - ".github/workflows/update-citations.yml"
      - ".github/workflows/test-citation-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline regression checks
        run: python -m unittest discover -s tests -p 'test_citation_updater.py' -v
